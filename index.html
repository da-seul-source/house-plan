<style>
/* VOICE: calm, exact, like a bank's worksheet a careful person keeps.
   IDEA: a household ledger: inputs on the left, the ledger reconciles on the right.
   PICTURE: the four headline figures and the monthly salary bar, live.
   COLOUR and TYPE: white / deep night, one calm teal accent; Plex Sans KR + Plex Mono numbers.
   LAYOUT: 380px input panel, results column; one column under 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1615);--panel:light-dark(#f2f7f6,#122220);--ink:light-dark(#14201f,#e3eeec);--mute:light-dark(#5b6b69,#93a6a3);
--line:light-dark(#d8e3e1,#24403c);--ac:light-dark(#0f766e,#3cc2b3);--acs:light-dark(#d7efec,#173a36);
--ok:light-dark(#1d7a3e,#56c983);--okb:light-dark(#e3f4e8,#14301f);--warn:light-dark(#8a6200,#e6b84a);--warnb:light-dark(#fdf3d6,#33290f);
--bad:light-dark(#b42318,#f07a6e);--badb:light-dark(#fde6e3,#3a1714);
--c1:light-dark(#0f766e,#3cc2b3);--c2:light-dark(#7fb8b1,#2c7a71);--c3:light-dark(#e3ecea,#1c2f2c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
.num,td.n,input[type=number],.big{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{padding:28px max(4vw,16px) 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(24px,3.4vw,34px);line-height:1.1;text-wrap:balance}
header p{margin:8px 0 0;color:var(--mute);max-width:70ch}
.wrap{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;padding:24px max(4vw,16px) 48px;max-width:1440px}
@media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--panel);border-radius:12px;padding:18px;align-self:start}
@media(min-width:901px){aside{position:sticky;top:76px;max-height:calc(100vh - 88px);overflow:auto}}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:14px 0 10px}

legend{font-weight:700;color:var(--ac);padding:0;margin-bottom:6px}
.f{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:4px 10px;align-items:center;margin:8px 0}
.f label{font-size:14px}.f small,.hint{grid-column:1/-1;color:var(--mute);font-size:13px;line-height:1.4}
input[type=number],select{width:100%;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right;min-height:40px}

select{text-align:left;font-family:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ck{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px;min-height:32px}.ck input{width:20px;height:20px;accent-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.auto{grid-column:1/-1;background:var(--acs);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.auto b{font-family:"IBM Plex Mono",monospace}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{margin:0;border:0;min-height:40px;color:var(--ink);padding:6px}.seg button[aria-pressed=true]{background:var(--ac);color:light-dark(#fff,#04201d);font-weight:700}

main{display:grid;gap:30px;align-content:start}
section h2{font-size:19px;margin:0 0 10px;line-height:1.25}

.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:14px 0 6px;background:var(--c3)}

.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;font-family:"IBM Plex Sans KR",sans-serif}

td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
tr.em td{background:var(--acs)}
.note{color:var(--mute);font-size:14px;margin:8px 0 0}
.sent{font-size:16px;line-height:1.6;max-width:70ch}.sent b{font-family:"IBM Plex Mono",monospace;color:var(--ac)}

nav.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;gap:4px;padding:8px max(4vw,16px);border-bottom:1px solid var(--line);flex-wrap:wrap}nav.top a{padding:10px 12px;font-size:15px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600;min-height:44px}nav.top a[aria-current=page]{background:var(--ac);color:light-dark(#fff,#04201d)}nav.top a:not([aria-current]):hover{background:var(--acs)}
@media(max-width:600px){table{font-size:13px}}
@media(max-width:900px){.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td.n{text-align:right}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);text-align:left}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
<style>

.u{font-size:12px;color:var(--mute);font-weight:400}aside legend{margin-bottom:2px}
:root{--fam:light-dark(#c2740c,#f0b35a);--bank:light-dark(#2f66c9,#7fa8ff)}
.f{grid-template-columns:minmax(0,1fr) 140px;margin:6px 0}.f label{font-size:15px}
input[type=number]{min-height:46px;font-size:17px;font-weight:600}

.hero2{border-radius:16px;padding:16px;border:2px solid var(--ac);background:var(--bg)}

.pay{display:grid}.pay span{font-size:13px;color:var(--mute)}.pay b{font:600 44px/1.1 "IBM Plex Mono",monospace;color:var(--ink)}.pay b small{font-size:18px;margin-left:2px}.pay em{font-style:normal;font-size:13px;color:var(--mute)}
.sbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0 6px}.sbar i{display:block;height:100%}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.kv div{background:var(--panel);border-radius:10px;padding:8px 10px;display:grid}.kv span{font-size:12px;color:var(--mute)}.kv b{font:600 16px "IBM Plex Mono",monospace}
.warnbox{border:1px solid light-dark(#e0a33a,#a87a2a);background:light-dark(#fff8eb,#2a2210);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5;margin:12px 0 0}
.unit{font-size:13px;color:var(--mute);font-weight:400;margin-left:6px}
.cmpwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}

.cmp3 thead th{font-size:16px;text-align:center;vertical-align:top;background:var(--panel)}.cmp3 thead small{font-size:11px;color:var(--mute);font-weight:600}
.cmp3 tbody th{text-align:left;font-weight:600;font-size:13px;width:31%}.cmp3 td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:14px}
.cmp3 .w{background:var(--acs)}.cmp3 thead th.w{background:var(--ac);color:light-dark(#fff,#04201d)}.cmp3 thead th.w small{color:inherit;opacity:.85}.cmp3 thead th.w .tag{background:light-dark(#fff,#04201d);color:var(--ac)}
.cmp3 tr.grp th{background:var(--panel);font-size:12px;color:var(--mute);padding:5px 8px}.cmp3 tr.big td{font-weight:700;font-size:15px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.pct{font-weight:700;background:none!important;padding:0}.pct.g{color:var(--ac)}.pct.y{color:light-dark(#b26b00,#f0b35a)}.pct.r,small.r{color:#d9534f}
@media(max-width:380px){.cmp3{font-size:12px}.cmp3 td.n{font-size:12.5px}.pay b{font-size:38px}}
</style>

<body>
<nav class="top"><a href="./" aria-current="page">계산기</a><a href="schedule.html">일정표</a><a href="fund.html">조달계획서</a><a href="taxpro.html">세무사</a></nav>
<header>
<h1>안양 집 자금계산기</h1>
<p>매매가와 내 돈만 넣으면 뭐가 이득인지, 매달 얼마 내는지 바로 나옵니다. 단위는 만원입니다.</p>
</header>
<div class="wrap">
<aside>
<form id="form" onsubmit="return false">
<fieldset><legend>집</legend>
<div class="f"><label for="price">매매가 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="price" step="100"></div>
</fieldset>
<fieldset><legend>내 돈</legend>
<div class="f"><label for="jeonse">지금 집 전세보증금 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="jeonse" step="100"></div>
<div class="f"><label for="cash">예금·주식 등 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="cash" step="100"></div>
<div class="f"><label for="reserve">비상금으로 남길 돈 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="reserve" step="100"></div>
<div class="f"><label for="income">월 실수령 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="income" step="10"></div>
</fieldset>
<fieldset><legend>은행</legend>
<div class="f"><label for="rate">은행 금리 %</label><input type="text" inputmode="decimal" autocomplete="off" id="rate" step="0.1"></div>
</fieldset>
<fieldset><legend>가족 무이자 차용 (한 분)</legend>
<div class="f"><label for="fsFree">무이자 차용액 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="fsFree" step="100"><small id="limD"></small></div>
<div class="f"><label for="fsTerm">만기 (년)</label><input type="text" inputmode="decimal" autocomplete="off" id="fsTerm" step="1"><small>만기에 남은 돈은 집 팔아서 상환</small></div>
<div class="f"><label for="fsRepay">매년 상환 비율 %</label><input type="text" inputmode="decimal" autocomplete="off" id="fsRepay" step="0.5"></div>
</fieldset>
<details class="set"><summary>부대비용 (견적 받으면 고치기)</summary>
<div class="f"><label for="lawyer">법무사·등기 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="lawyer"></div>
<div class="f"><label for="bond">국민주택채권 할인 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="bond"></div>
<div class="f"><label for="move">이사비 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="move"></div>
<div class="f"><label for="taxpro">세무사 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="taxpro"><small>모담 견적 33 (조달계획서 포함)</small></div>
<div class="f"><label for="notary">차용증 확정일자·공증 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="notary"></div>
<div class="f"><label for="floor">도배·바닥 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="floor"></div>
<div class="f"><label for="appl">가전·가구 <span class="u">만원</span></label><input type="text" inputmode="decimal" autocomplete="off" id="appl"></div>
<p class="hint">취득세·중개보수·은행 인지세는 자동 계산합니다.</p>
</details>
<p class="hint">고정값: 생애최초 예, 85㎡ 초과 아니오, 은행 30년, 대출 한도 매매가의 40%, 적정이자율 4.6%, 남은 증여 공제 1,200만.</p>
<p><button type="button" id="reset">처음 값으로 되돌리기</button></p>
</form>
</aside>
<main><div id="hero" style="margin-bottom:22px"></div><div id="out"></div></main>
</div>
<script>
{
const DEF={price:58000,jeonse:5000,cash:13000,reserve:500,income:450,rate:5.0,fsFree:21700,fsTerm:5,fsRepay:5,lawyer:100,bond:40,move:150,taxpro:30,notary:10,floor:0,appl:0};
const FIX={first:true,over85:false,years:30,ltv:40,fsMkt:4.6,giftDed:1200},KEY='anyang-home-calc-v1',TK=KEY+'-t',ids=Object.keys(DEF),$=id=>document.getElementById(id);
function pmt(P,r,y){const n=Math.round(y*12),i=r/1200;if(P<=0||n<=0)return 0;return i===0?P/n:P*i/(1-Math.pow(1+i,-n))}
function cumInt(P,r,y,m){const n=Math.round(y*12),i=r/1200,M=pmt(P,r,y);let b=P,s=0;for(let k=0;k<Math.min(m,n);k++){const it=b*i;s+=it;b-=M-it}return s}
function bal(P,r,y,m){const i=r/1200,M=pmt(P,r,y);let b=P;for(let k=0;k<m;k++)b-=M-b*i;return Math.max(0,b)}
function giftTax(a,d){const t=Math.max(0,a-d);let x;if(t<=10000)x=t*.1;else if(t<=50000)x=t*.2-1000;else if(t<=100000)x=t*.3-6000;else if(t<=300000)x=t*.4-16000;else x=t*.5-46000;return Math.max(0,x)*0.97}
function acqRate(p){if(p<=60000)return 1;if(p<=90000)return Math.round((p/10000*2/3-3)*100)/100;return 3}
function stampTax(l){return l<=5000?0:l<=10000?3.5:l<=100000?7.5:17.5}
function fmt(v,d=0){const x=Math.abs(v)<0.5*Math.pow(10,-d)?0:v;return x.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d})}
const fmtM=v=>fmt(v,1);
function fmtE(v){const neg=v<0,a=Math.round(Math.abs(v));let s;if(a>=10000){const e=Math.floor(a/10000),r=a%10000;s=e+'억'+(r?' '+r.toLocaleString('ko-KR')+'만':'')}else s=a.toLocaleString('ko-KR')+'만';return(neg?'−':'')+s}
const B=(c,t)=>`<span class="badge ${c}">${t}</span>`;
function load(s){if(!s){s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}}for(const k of ids){const v=k in s?s[k]:DEF[k],el=$(k);if(el.type==='checkbox')el.checked=!!v;else el.value=typeof v==='number'?v.toLocaleString('ko-KR',{maximumFractionDigits:2}):v}}
function read(){const I=Object.assign({},FIX);for(const k of ids){const el=$(k);I[k]=el.type==='checkbox'?el.checked:(parseFloat(String(el.value).replace(/[^0-9.\-]/g,''))||0)}return I}
function save(I){let o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}for(const k of ids)o[k]=I[k];try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
const touch=()=>{try{localStorage.setItem(TK,Date.now())}catch(e){}if(window.CPush)CPush()};
window.CALC={get:()=>{let o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}return{s:JSON.stringify(Object.assign(o,read())),t:+(localStorage.getItem(TK)||0)}},apply(o){try{localStorage.setItem(KEY,o.s);localStorage.setItem(TK,o.t)}catch(e){}load();render()}};
function calc(I){
 const R={};R.acqRate=acqRate(I.price);R.acq=I.price*R.acqRate/100;R.edu=R.acq*.1;R.agri=I.over85?I.price*.002:0;
 R.relief=(I.first&&I.price<=120000)?-Math.min(200,R.acq):0;R.brokerRate=I.price<90000?.4:.5;R.broker=I.price*R.brokerRate/100;R.vat=R.broker*.1;
 R.direct=I.lawyer+I.bond+I.move+I.taxpro+I.notary+I.floor+I.appl;
